[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-organizer"
version = "2.6.2"
description = "Automatically organize your music library with online metadata and audio fingerprinting"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
music-organizer = "music_organizer_cli:main"
music-organizer-gui = "music_organizer_gui:main"
# NOTE: the webview frontend is intentionally NOT a console script. It imports
# `webview` at module top, which is a Windows/macOS runtime dep not installed in
# the (headless, cross-platform) test job; exposing it here would make
# tests/test_entry_points.py import it in CI and fail. It ships as a module and
# runs via `python -m music_organizer_web` (see README).

[tool.setuptools]
py-modules = ["music_core", "config", "matching", "fpcalc_installer", "music_organizer_cli", "music_organizer_gui", "music_organizer_web"]

[tool.setuptools.packages.find]
include = ["music_organizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["music_core", "config", "matching", "music_organizer"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
