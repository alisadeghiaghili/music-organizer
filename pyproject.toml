[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "music-organizer"
version = "2.1.0"
description = "Automatically organize your music library with online metadata and audio fingerprinting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
music-organizer = "music_organizer_cli:main"
music-organizer-gui = "music_organizer_gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["music_core", "config"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
