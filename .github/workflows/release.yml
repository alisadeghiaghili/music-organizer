name: Release builds

# Build the standalone GUI + CLI for Windows and macOS, then attach the
# zipped artifacts to the (already-published) GitHub Release. The fpcalc
# fingerprinting binary is downloaded from its live GitHub release assets and
# embedded into each build, so users get audio fingerprinting out of the box.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # GUI is now the pywebview (WebView2) frontend: needs pywebview + the
          # .NET bridge (pythonnet). mutagen/rich stay for the CLI and the
          # shared engine.
          pip install mutagen rich pyinstaller pywebview pythonnet

      - name: Download fpcalc.exe
        shell: pwsh
        run: |
          $ver = (python -c "import fpcalc_installer as f; print(f.FPCALC_VERSION)").Trim()
          $url = "https://github.com/acoustid/chromaprint/releases/download/v${ver}/chromaprint-fpcalc-${ver}-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile fpcalc.zip
          Expand-Archive fpcalc.zip -DestinationPath fpcalc-extract
          $bin = Get-ChildItem -Path fpcalc-extract -Recurse -Filter fpcalc.exe | Select-Object -First 1
          Move-Item $bin.FullName .\fpcalc.exe -Force
          Write-Host "fpcalc v$ver downloaded."

      - name: Build GUI
        shell: pwsh
        run: |
          # pywebview ships a PyInstaller hook that bundles the WebView2 runtime
          # (webview/lib) and pythonnet ships one for clr — so we only need the
          # platform modules + the icon. (Do NOT --collect-all webview: it forces
          # an import of the WinForms platform, which calls clr.AddReference at
          # analysis time and aborts the build.)
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "MusicOrganizer-GUI" `
            --icon "app.ico" `
            --add-binary "fpcalc.exe;." `
            --add-data "icon.png;." `
            --add-data "app.ico;." `
            --hidden-import music_core --hidden-import fpcalc_installer --hidden-import config `
            --hidden-import webview.platforms.winforms --hidden-import pythonnet `
            --collect-all mutagen `
            music_organizer_web.py

      - name: Build CLI
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name "MusicOrganizer-CLI" `
            --add-binary "fpcalc.exe;." `
            --hidden-import music_core --hidden-import fpcalc_installer --hidden-import config `
            --collect-all mutagen --collect-all rich `
            music_organizer_cli.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\*.exe -DestinationPath MusicOrganizer-Windows.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MusicOrganizer-Windows.zip
            dist/MusicOrganizer-GUI.exe

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # GUI is now the pywebview (WKWebView) frontend: on macOS pywebview
          # pulls the PyObjC Cocoa/WebKit frameworks it needs.
          pip install mutagen rich pyinstaller pywebview

      - name: Download fpcalc
        run: |
          set -euo pipefail
          ver=$(python -c "import fpcalc_installer as f; print(f.FPCALC_VERSION)")
          url="https://github.com/acoustid/chromaprint/releases/download/v${ver}/chromaprint-fpcalc-${ver}-macos-arm64.tar.gz"
          curl -L "$url" -o fpcalc.tgz
          tar -xzf fpcalc.tgz
          bin=$(find . -type f -name fpcalc | head -1)
          chmod +x "$bin"
          cp "$bin" ./fpcalc
          echo "fpcalc v${ver} downloaded."

      - name: Build GUI
        run: |
          # pywebview ships a PyInstaller hook that bundles its js assets. The
          # cocoa (WKWebView) platform pulls PyObjC frameworks at import time, so
          # force it explicitly; the bundled hook handles the rest.
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "MusicOrganizer-GUI" \
            --icon "app.icns" \
            --add-binary "fpcalc:." \
            --add-data "icon.png:." \
            --hidden-import music_core --hidden-import fpcalc_installer --hidden-import config \
            --hidden-import webview.platforms.cocoa \
            --collect-all mutagen \
            music_organizer_web.py

      - name: Build CLI
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "MusicOrganizer-CLI" \
            --add-binary "fpcalc:." \
            --hidden-import music_core --hidden-import fpcalc_installer --hidden-import config \
            --collect-all mutagen --collect-all rich \
            music_organizer_cli.py

      - name: Package
        run: |
          zip -j MusicOrganizer-macOS.zip dist/MusicOrganizer-GUI dist/MusicOrganizer-CLI
          # Platform-qualified name for the standalone so it doesn't collide with
          # the Linux standalone (both are extensionless "MusicOrganizer-GUI").
          cp dist/MusicOrganizer-GUI dist/MusicOrganizer-GUI-macos

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MusicOrganizer-macOS.zip
            dist/MusicOrganizer-GUI-macos

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The webview GUI uses GTK3 + WebKit2GTK on Linux. The runtime libraries
      # are present on a normal desktop distro; the *-dev packages are needed
      # here because PyGObject builds from source (no prebuilt Linux wheel) and
      # compiles against cairo / glib / gobject-introspection.
      - name: Install GTK / WebKit2GTK + build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcairo2-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libgirepository-1.0-1 \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            gir1.2-soup-3.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # GUI is now the pywebview (GTK3/WebKit2GTK) frontend on Linux: the
          # [gtk] extra pulls PyGObject.
          pip install mutagen rich pyinstaller pyinstaller-hooks-contrib "pywebview[gtk]"

      - name: Download fpcalc
        run: |
          set -euo pipefail
          ver=$(python -c "import fpcalc_installer as f; print(f.FPCALC_VERSION)")
          url="https://github.com/acoustid/chromaprint/releases/download/v${ver}/chromaprint-fpcalc-${ver}-linux-x86_64.tar.gz"
          curl -L "$url" -o fpcalc.tgz
          tar -xzf fpcalc.tgz
          bin=$(find . -type f -name fpcalc | head -1)
          chmod +x "$bin"
          cp "$bin" ./fpcalc
          echo "fpcalc v${ver} downloaded."

      - name: Build GUI
        run: |
          # Force the gtk platform (PyGObject); --collect-all gi bundles the PyGObject
          # C extension so `gi.repository` resolves inside the frozen binary.
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "MusicOrganizer-GUI" \
            --add-binary "fpcalc:." \
            --add-data "icon.png:." \
            --hidden-import music_core --hidden-import fpcalc_installer --hidden-import config \
            --hidden-import webview.platforms.gtk \
            --collect-all gi \
            --collect-all mutagen \
            music_organizer_web.py

      - name: Build CLI
        run: |
          pyinstaller --noconfirm --clean --onefile --console \
            --name "MusicOrganizer-CLI" \
            --add-binary "fpcalc:." \
            --hidden-import music_core --hidden-import fpcalc_installer --hidden-import config \
            --collect-all mutagen --collect-all rich \
            music_organizer_cli.py

      - name: Package
        run: |
          tar -czf MusicOrganizer-Linux.tar.gz -C dist MusicOrganizer-GUI MusicOrganizer-CLI
          # Platform-qualified name for the standalone (see the macOS job).
          cp dist/MusicOrganizer-GUI dist/MusicOrganizer-GUI-linux

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MusicOrganizer-Linux.tar.gz
            dist/MusicOrganizer-GUI-linux
